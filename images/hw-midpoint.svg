<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="auto" style="background:#ffffff;border-radius:10px;max-width:640px;margin:0 auto;display:block"><rect width="640" height="420" fill="#ffffff"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2937"/></marker></defs><line x1="120" y1="220" x2="540" y2="220" stroke="#1f2937" stroke-width="3.4"/><circle cx="120" cy="220" r="4.5" fill="#1f2937"/><circle cx="540" cy="220" r="4.5" fill="#1f2937"/><circle cx="340" cy="220" r="4.5" fill="#1f2937"/><circle cx="230" cy="220" r="4.5" fill="#1f2937"/><circle cx="450" cy="220" r="4.5" fill="#1f2937"/><text x="105" y="205" font-family="sans-serif" font-size="18" fill="bold" text-anchor="middle" font-weight="normal">A</text><text x="555" y="205" font-family="sans-serif" font-size="18" fill="bold" text-anchor="middle" font-weight="normal">B</text><text x="345" y="205" font-family="sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="normal">C</text><text x="220" y="205" font-family="sans-serif" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="normal">M</text><text x="462" y="205" font-family="sans-serif" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="normal">N</text><text x="225" y="258" font-family="sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="normal">AM = MC</text><text x="455" y="258" font-family="sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="normal">CN = NB</text><text x="330" y="258" font-family="sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="normal">AB = 18 cm</text><text x="330" y="130" font-family="sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="normal">M、N 分别是 AC、CB 的中点，求 MN</text></svg>