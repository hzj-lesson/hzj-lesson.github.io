<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="auto" style="background:#ffffff;border-radius:10px;max-width:640px;margin:0 auto;display:block"><rect width="640" height="420" fill="#ffffff"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2937"/></marker></defs><line x1="120" y1="110" x2="540" y2="110" stroke="#1f2937" stroke-width="3"/><text x="558" y="115" font-family="sans-serif" font-size="17" fill="bold" text-anchor="middle" font-weight="normal">A —— B</text><line x1="120" y1="320" x2="540" y2="320" stroke="#1f2937" stroke-width="3"/><text x="558" y="325" font-family="sans-serif" font-size="17" fill="bold" text-anchor="middle" font-weight="normal">C —— D</text><path d="M120,110 L200,110 L330,320" fill="none" stroke="#2563eb" stroke-width="2.6"/><path d="M120,320 L200,320 L330,320" fill="none" stroke="#2563eb" stroke-width="2.6"/><line x1="330" y1="320" x2="330" y2="110" stroke="#16a34a" stroke-width="2.0" stroke-dasharray="6,5"/><circle cx="330" cy="320" r="4.5" fill="#1f2937"/><text x="342" y="318" font-family="sans-serif" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="normal">E</text><text x="190" y="92" font-family="sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="normal">∠A = 35°</text><text x="190" y="350" font-family="sans-serif" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="normal">∠C = 50°</text><text x="345" y="215" font-family="sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="normal">EF ∥ AB</text><text x="330" y="60" font-family="sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="normal">过 E 作 EF ∥ AB，求 ∠AEC</text></svg>