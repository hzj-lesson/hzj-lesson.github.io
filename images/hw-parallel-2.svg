<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="auto" style="background:#ffffff;border-radius:10px;max-width:640px;margin:0 auto;display:block"><rect width="640" height="420" fill="#ffffff"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2937"/></marker></defs><line x1="120" y1="150" x2="540" y2="150" stroke="#1f2937" stroke-width="3"/><text x="558" y="155" font-family="sans-serif" font-size="18" fill="bold" text-anchor="middle" font-weight="normal">l₁</text><line x1="120" y1="260" x2="540" y2="260" stroke="#1f2937" stroke-width="3"/><text x="558" y="265" font-family="sans-serif" font-size="18" fill="bold" text-anchor="middle" font-weight="normal">l₂</text><line x1="220" y1="70" x2="440" y2="340" stroke="#2563eb" stroke-width="2.6"/><circle cx="270" cy="150" r="4.5" fill="#1f2937"/><circle cx="340" cy="260" r="4.5" fill="#1f2937"/><text x="245" y="138" font-family="sans-serif" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="normal">∠1 = 60°</text><text x="330" y="300" font-family="sans-serif" font-size="17" fill="#16a34a" text-anchor="middle" font-weight="normal">∠3 = 120°</text><text x="350" y="150" font-family="sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="normal">∠2</text><text x="330" y="60" font-family="sans-serif" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="normal">∠1 + ∠2 = 180°，说明 l₁ ∥ l₂</text></svg>