<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="auto" style="background:#ffffff;border-radius:10px;max-width:640px;margin:0 auto;display:block"><rect width="640" height="420" fill="#ffffff"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f2937"/></marker></defs><polygon points="120,300 400,160 560,160 280,300" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.2"/><line x1="140" y1="300" x2="540" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/><line x1="280" y1="230" x2="280" y2="120" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><text x="288" y="130" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="normal">N（支持力）</text><line x1="280" y1="230" x2="280" y2="330" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><text x="288" y="340" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="normal">G（重力）</text><line x1="280" y1="230" x2="400" y2="230" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/><text x="408" y="224" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="normal">f（摩擦力）</text><text x="320" y="405" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal">受力分析：支持力 N、重力 G、摩擦力 f（斜面上物体）</text></svg>